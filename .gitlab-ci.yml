stages:
  - checkvars
  - readsecret
print variables:
  stage: checkvars
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://gitlab.com
  environment:
    name: DEMOSTACK
  before_script:
    - export VAULT_ADDR=$VAULT_SERVER_URL
    - export VAULT_NAMESPACE=$VAULT_NAMESPACE
  script:
    - echo $VAULT_ADDR
    - echo $VAULT_NAMESPACE
read secret:
  stage: readsecret
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://gitlab.com
  environment:
    name: DEMOSTACK
  secrets:
    MY_SECRET_1:
      vault: test/foo@kv
      file: false
      # test - The secret
      # foo - The field
      # kv - The path where the secrets engine is mounted
  script:
    - echo $VAULT_SERVER_URL
    - echo $VAULT_AUTH_ROLE
    - echo $VAULT_AUTH_PATH
    - echo $VAULT_NAMESPACE
    - echo $MY_SECRET_1